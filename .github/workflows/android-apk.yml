name: Android test APK
on:
  push:
    branches: [feature/android-apk, feature/offline-apk]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test
      - run: npx expo prebuild --platform android --no-install
      - name: Build standalone test APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,armeabi-v7a '-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m'
      - name: Verify package and test signature
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/release/app-release.apk apk-output/Lume-Fit-0.1.1-offline.apk
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --verbose --print-certs apk-output/Lume-Fit-0.1.1-offline.apk > apk-output/signature.txt
          grep 'fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c' apk-output/signature.txt
          analyzer=$(find "$ANDROID_HOME" -name aapt -type f | sort -V | tail -1)
          "$analyzer" dump badging apk-output/Lume-Fit-0.1.1-offline.apk > apk-output/package.txt
          grep "package: name='com.lumeproductions.lumefit'" apk-output/package.txt
          if "$analyzer" dump xmltree apk-output/Lume-Fit-0.1.1-offline.apk AndroidManifest.xml | grep -q 'android:debuggable.*0xffffffff'; then exit 1; fi
          if grep -q 'android.permission.SYSTEM_ALERT_WINDOW' apk-output/package.txt; then exit 1; fi
          unzip -p apk-output/Lume-Fit-0.1.1-offline.apk assets/index.android.bundle > /tmp/lume-bundle
          grep -a 'LUME_PACKAGED_OFFLINE_V1' /tmp/lume-bundle > /dev/null
          cd apk-output
          sha256sum Lume-Fit-0.1.1-offline.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Lume-Fit-Android-APK
          path: mobile/apk-output/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
