name: Frontend checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node prepare-release.cjs --check
      - run: node checks.cjs
      - run: node profile-db-checks.cjs
      - run: node friends-db-checks.cjs
